server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 100
                      requestedTokens: 5
                      key-resolver: "#{@ipKeyResolver}"
            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/api/v1/patients/**
              filters:
                - name: JwtAuth
                  args:
                    GET: [ ADMIN ]
                    POST: [ ADMIN ]
                - name: RequestRateLimiter
                  args:
                    GET: [ ADMIN ]
                    POST: [ ADMIN ]
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 100
                      requestedTokens: 5
                      key-resolver: "#{@ipKeyResolver}"
  data:
    redis:
      host: ${REDIS_Host:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.data.redis: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
jwt:
  public:
    public-key-path: ${JWT_KEY_PEM_PATH:keys/public.pem }
