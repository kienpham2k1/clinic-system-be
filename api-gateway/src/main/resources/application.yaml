server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 100
                      requestedTokens: 5
                    key-resolver: "#{@ipKeyResolver}"
            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/api/v1/patients/**
              filters:
                - name: JwtAuth
                  args:
                    GET: [ ADMIN ]
                    POST: [ ADMIN ]
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50
                      burstCapacity: 100
                      requestedTokens: 5
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: patientCircuit
                    fallbackUri: forward:/fallback/patients

  data:
    redis:
      host: ${REDIS_Host:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.data.redis: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
jwt:
  public:
    public-key-path: ${JWT_KEY_PEM_PATH:keys/public.pem}
  ttl: 300000
springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: http://localhost:8080/v3/api-docs
      - name: auth-service
        url: http://localhost:8090/v3/api-docs
      - name: patient-service
        url: http://localhost:8091/v3/api-docs
    path: /swagger-ui.html
    urls-primary-name: auth-service
    deep-linking: true
  api-docs:
    path: /v3/api-docs
