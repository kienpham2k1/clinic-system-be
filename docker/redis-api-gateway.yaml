version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-api-gateway
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  redis-data:
