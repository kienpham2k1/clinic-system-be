version: '3.8'

services:

  patient-db:
    image: postgres:15
    container_name: patient-db
    environment:
      POSTGRES_DB: clinic_patient
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic123
    ports:
      - "5433:5432"
    volumes:
      - patient_db_data:/var/lib/postgresql/data
    networks:
      - clinic-network

  patient-service:
    build: .
    container_name: patient-service
    depends_on:
      - patient-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/clinic_patient
      SPRING_DATASOURCE_USERNAME: clinic
      SPRING_DATASOURCE_PASSWORD: clinic123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://host.docker.internal:8761/eureka
    ports:
      - "8081:8080"
    networks:
      - clinic-network

volumes:
  patient_db_data:

networks:
  clinic-network:
    driver: bridge
